<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!--
    Marca d'água do fundo do login: a própria marca (lupa + pegada, mesma
    geometria de src/components/petfinder-mark.tsx), num verde escuro fixo
    (green-700) — não usa currentColor porque é referenciada via CSS
    background-image. Tom sobre tom com o fundo green-300 (mesma família
    de cor), para ter contraste real em vez de um cinza que se perdia no
    verde. Um exemplar por ladrilho, levemente girado; o espaçamento vem
    do background-size em auth-layout.tsx.
  -->
  <g transform="rotate(-8 80 80) translate(36.5,36.5) scale(0.75)">
    <g fill="#15803d" stroke="none">
      <ellipse cx="50" cy="57" rx="6.5" ry="5.5" />
      <ellipse cx="39" cy="48" rx="3.5" ry="4.5" transform="rotate(-20 39 48)" />
      <ellipse cx="46" cy="42" rx="3.5" ry="4.5" transform="rotate(-8 46 42)" />
      <ellipse cx="54" cy="42" rx="3.5" ry="4.5" transform="rotate(8 54 42)" />
      <ellipse cx="61" cy="48" rx="3.5" ry="4.5" transform="rotate(20 61 48)" />
    </g>
    <g fill="none" stroke="#15803d" stroke-linecap="round">
      <circle cx="50" cy="50" r="25" stroke-width="7" />
      <circle cx="50" cy="50" r="20" stroke-width="2" />
      <line x1="68" y1="68" x2="82" y2="82" stroke-width="7" />
      <circle cx="86" cy="86" r="5" fill="#15803d" stroke="none" />
    </g>
  </g>
</svg>
