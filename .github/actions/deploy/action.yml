name: Deploy to server
description: Pull a GHCR image and deploy the Next.js app over SSH.

inputs:
  host:
    description: Server hostname or IPv4 address
    required: true
  user:
    description: SSH user with Docker access
    required: true
  port:
    description: SSH port
    default: "22"
  deploy-path:
    description: Absolute deployment directory containing the server .env file
    required: true
  ssh-key:
    description: SSH private key for the deployment user
    required: true
  image:
    description: GHCR image reference pinned by digest
    required: true
  revision:
    description: Commit SHA used for the release directory
    required: true

runs:
  using: composite
  steps:
    - name: Validate settings and deploy over SSH
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        HOST: ${{ inputs.host }}
        USER: ${{ inputs.user }}
        PORT: ${{ inputs.port }}
        DEPLOY_PATH: ${{ inputs.deploy-path }}
        SSH_KEY: ${{ inputs.ssh-key }}
        APP_IMAGE: ${{ inputs.image }}
        DEPLOY_REVISION: ${{ inputs.revision }}
      run: |
        set -euo pipefail

        missing=0
        for setting in HOST USER DEPLOY_PATH SSH_KEY; do
          if [[ -z "${!setting:-}" ]]; then
            echo "::error::Missing $setting. Configure it under repository Settings > Secrets and variables > Actions, or in the production environment. Server .env values are not available to GitHub Actions."
            missing=1
          fi
        done
        if (( missing )); then
          exit 1
        fi

        PORT=${PORT:-22}
        invalid() {
          echo "::error::Invalid $1. $2"
          exit 1
        }
        # These values also become part of a remote shell command.
        [[ "$HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || invalid HOST "Use a hostname or IPv4 address without a protocol or port."
        [[ "$USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || invalid USER "Use an SSH username."
        [[ "$PORT" =~ ^[0-9]{1,5}$ ]] || invalid PORT "Use a port from 1 to 65535."
        (( 10#$PORT >= 1 && 10#$PORT <= 65535 )) || invalid PORT "Use a port from 1 to 65535."
        [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEPLOY_PATH" != / ]] || invalid DEPLOY_PATH "Use an absolute directory without spaces, such as /opt/petfinder."
        [[ "$DEPLOY_REVISION" =~ ^[a-f0-9]{40}$ ]] || invalid revision "Use the full commit SHA."
        [[ "$APP_IMAGE" =~ ^ghcr.io/[a-z0-9_./-]+@sha256:[a-f0-9]{64}$ ]] || invalid image "Use a GHCR image pinned by SHA256 digest."

        ssh_dir=$(mktemp -d)
        trap 'rm -rf "$ssh_dir"' EXIT
        chmod 700 "$ssh_dir"
        printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
        chmod 600 "$ssh_dir/key"
        # Trust the first connection and reject host-key changes during this deployment.
        ssh_options=(-i "$ssh_dir/key" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15)
        destination="$USER@$HOST"
        release_dir="$DEPLOY_PATH/releases/$DEPLOY_REVISION"

        tar -czf - compose.production.yaml deploy/run.sh |
          ssh "${ssh_options[@]}" "$destination" "mkdir -p '$release_dir' && tar -xzf - -C '$release_dir'"
        ssh "${ssh_options[@]}" "$destination" \
          "cd '$release_dir' && bash deploy/run.sh '$DEPLOY_PATH' '$APP_IMAGE'"
